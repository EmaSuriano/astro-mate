- url: https://astro-mate.netlify.app/
  output: screenshots/home-dark.png
  width: 1440
  height: 900
  wait: 1500
  javascript: |
    async () => {
      localStorage.setItem("theme", "dark");
      document.documentElement.setAttribute("data-theme", "dark");
      const input = document.querySelector("input.theme-controller");
      if (input) input.checked = true;
      await new Promise((r) => setTimeout(r, 500));
    }

- url: https://astro-mate.netlify.app/
  output: screenshots/projects-dark.png
  width: 1440
  height: 900
  wait: 1500
  selector: "#projects"
  padding: 16
  javascript: |
    async () => {
      localStorage.setItem("theme", "dark");
      document.documentElement.setAttribute("data-theme", "dark");
      const input = document.querySelector("input.theme-controller");
      if (input) input.checked = true;
      await new Promise((r) => setTimeout(r, 500));
      document.querySelector("#projects")?.scrollIntoView({ block: "center" });
    }
